<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#775d3c"><title>工工四 練習プレーヤー｜絲庵</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=380"><link rel="stylesheet" href="player.css?v=380"><link rel="stylesheet" href="player-layout-v3.css?v=380"></head><body>
<header><div><span class="eyebrow">絲庵 SHIAN</span><h1>工工四 練習プレーヤー</h1></div><span class="readOnlyBadge">読込み専用</span></header>
<main><section class="panel loadPanel"><div><h2>演奏する工工四</h2><p>内蔵曲を選ぶか、工工四エディターで保存したJSONを読み込んでください。</p></div><label>内蔵曲<select id="builtinSelect" aria-label="内蔵曲を選択"></select></label><button id="builtinBtn">内蔵曲を表示</button><label class="fileBtn primary">JSONを読み込む<input id="importFile" type="file" accept="application/json,.json"></label><div id="builtinSongs" class="builtinSongs" aria-label="内蔵曲一覧"></div></section>
<section class="panel songInfo"><div><span>曲名</span><strong id="songTitle">童神</strong></div><div><span>作者</span><strong id="songAuthor">沖縄島唄</strong></div><div><span>ちんだみ</span><strong id="songTuning">本調子</strong></div><label>速度 <output id="tempoOut">104 BPM</output><input id="tempo" type="range" min="40" max="180" value="104"></label><label>音量 <output id="volumeOut">80%</output><input id="volume" type="range" min="0" max="100" value="80"></label></section>
<div class="paletteToolbar"><h2>演奏練習</h2><label class="paletteToggle"><input id="paletteToggle" type="checkbox" checked><span>三線パレットを表示</span></label></div>
<section id="lanePanel" class="panel lanePanel" aria-label="勘所練習レーン">
  <div class="laneHeader"><div><span>自動演奏と連動</span><h2>勘所練習レーン</h2></div><label class="laneToggle"><input id="laneToggle" type="checkbox" checked><span>表示</span></label></div>
  <div id="laneBody" class="laneBody">
    <div class="laneViewport">
      <div class="laneStrings" aria-hidden="true"><span>三弦</span><span>二弦</span><span>一弦</span></div>
      <div id="laneColumns" class="laneColumns" aria-label="演奏中の列と次の列"></div>
    </div>
  </div>
</section>
<section id="practiceStage" class="practiceStage">
  <div id="kandoPanel" class="panel kandoPanel" aria-label="演奏中の三線の勘所">
    <div class="kandoVisual"><img id="kandoImage" src="kando-hd/tindami2.png" width="1140" height="558" alt="三線の勘所"><img class="legacyCharacter" src="kando-hd/cha1.gif" width="58" height="74" alt="三線を弾く猫"></div>
    <div id="noteWindow" class="noteWindow" aria-label="過去1音・現在音・次の3音"></div>
  </div>
</section>
<section id="fullScoreViewport" class="scoreViewport fullScoreViewport" aria-label="工工四全体（横スクロール）" tabindex="0"><div id="paper" class="paper playerPaper"><div class="paperBody"><div class="paperTitle"><b id="paperTitle">童神</b><span id="paperMeta">沖縄島唄・本調子</span></div><div id="score" class="score"></div></div></div></section>
<section class="panel transport"><div><h2>自動演奏</h2><p id="playStatus" aria-live="polite">停止中</p></div><button id="playBtn" class="primary">▶ 最初から演奏</button><button id="pauseBtn" disabled>Ⅱ 一時停止</button><button id="stopBtn">■ 停止</button></section><p id="errorMessage" class="errorMessage" role="alert" hidden></p></main>
<script src="sample-score.js?v=380"></script><script src="legacy-songs.js?v=380"></script><script src="player.js?v=380"></script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));</script></body></html>
