<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 500" role="img" aria-labelledby="title desc">
  <title id="title">三線の縦型勘所図</title>
  <desc id="desc">一弦、二弦、三弦の開放弦から八までの勘所</desc>
  <style>
    .kandoHit{fill:transparent;stroke:transparent;stroke-width:5;cursor:pointer;outline:none}
    .kandoHit:hover,.kandoHit:focus-visible,.kandoHit.active{stroke:#e7bd5c}
  </style>
  <rect width="260" height="500" rx="18" fill="#fffdf7"/>
  <path d="M35 18h190l-18 72v384H53V90z" fill="#101111"/>
  <path d="M53 92h154" stroke="#fff" stroke-width="5"/>
  <g stroke="#8b9699" stroke-width="2"><path d="M88 92v382"/><path d="M130 92v382"/><path d="M172 92v382"/></g>
  <g fill="#fff" font-family="Yu Gothic, sans-serif" font-size="15" font-weight="700"><text x="72" y="76">一弦</text><text x="114" y="76">二弦</text><text x="156" y="76">三弦</text></g>
  <g fill="#13ead5" font-family="Yu Gothic, sans-serif" font-size="14" font-weight="700"><text x="8" y="112">開放弦</text></g>
  <g fill="#e92c27" stroke="#fff" stroke-width="1">
    <circle cx="88" cy="105" r="16"/><circle cx="130" cy="105" r="16"/><circle cx="172" cy="105" r="16"/>
    <circle cx="88" cy="190" r="16"/><circle cx="130" cy="190" r="16"/><circle cx="172" cy="190" r="16"/>
    <circle cx="88" cy="275" r="16"/><circle cx="130" cy="275" r="16"/><circle cx="172" cy="275" r="16"/>
    <circle cx="88" cy="360" r="16"/><circle cx="130" cy="360" r="16"/><circle cx="172" cy="360" r="16"/>
    <circle cx="172" cy="445" r="16"/>
  </g>
  <g fill="#fff" font-family="Yu Mincho, serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="88" y="105">合</text><text x="130" y="105">四</text><text x="172" y="105">工</text>
    <text x="88" y="190">乙</text><text x="130" y="190">上</text><text x="172" y="190">五</text>
    <text x="88" y="275">老</text><text x="130" y="275">中</text><text x="172" y="275">六</text>
    <text x="88" y="360">下老</text><text x="130" y="360">尺</text><text x="172" y="360">七</text>
    <text x="172" y="445">八</text>
  </g>
  <g aria-label="勘所入力ボタン">
    <circle class="kandoHit" data-note="合" role="button" tabindex="0" aria-label="合を入力" cx="88" cy="105" r="21"/>
    <circle class="kandoHit" data-note="四" role="button" tabindex="0" aria-label="四を入力" cx="130" cy="105" r="21"/>
    <circle class="kandoHit" data-note="工" role="button" tabindex="0" aria-label="工を入力" cx="172" cy="105" r="21"/>
    <circle class="kandoHit" data-note="乙" role="button" tabindex="0" aria-label="乙を入力" cx="88" cy="190" r="21"/>
    <circle class="kandoHit" data-note="上" role="button" tabindex="0" aria-label="上を入力" cx="130" cy="190" r="21"/>
    <circle class="kandoHit" data-note="五" role="button" tabindex="0" aria-label="五を入力" cx="172" cy="190" r="21"/>
    <circle class="kandoHit" data-note="老" role="button" tabindex="0" aria-label="老を入力" cx="88" cy="275" r="21"/>
    <circle class="kandoHit" data-note="中" role="button" tabindex="0" aria-label="中を入力" cx="130" cy="275" r="21"/>
    <circle class="kandoHit" data-note="六" role="button" tabindex="0" aria-label="六を入力" cx="172" cy="275" r="21"/>
    <circle class="kandoHit" data-note="下老" role="button" tabindex="0" aria-label="下老を入力" cx="88" cy="360" r="21"/>
    <circle class="kandoHit" data-note="尺" role="button" tabindex="0" aria-label="尺を入力" cx="130" cy="360" r="21"/>
    <circle class="kandoHit" data-note="七" role="button" tabindex="0" aria-label="七を入力" cx="172" cy="360" r="21"/>
    <circle class="kandoHit" data-note="八" role="button" tabindex="0" aria-label="八を入力" cx="172" cy="445" r="21"/>
  </g>
</svg>
